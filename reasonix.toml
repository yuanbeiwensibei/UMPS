"\\'`':\n        q = c; i += 1\n        while i < n:\n            if js[i] == '\\\\': i += 2; continue\n            if js[i] == q: i += 1; break\n            i += 1\n        continue\n    out.append(c); i += 1\n\nclean = ''.join(out)\nfor a, b in [('{','}'), ('(',')'), ('[',']')]:\n    print(f'js {a}{b}: {clean.count(a)} / {clean.count(b)}', 'OK' if clean.count(a)==clean.count(b) else 'MISMATCH')\n\n# 关键 DOM id / class 是否与 JS 引用一致\nfor ident in ['progressBar', 'nav', 'data-reveal', 'data-count', 'data-parallax', '.panel', '.row__bar']:\n    print(f'{ident:14} referenced in html: {ident in src}')\nPY", "Bash=cd \"$(git rev-parse --show-toplevel 2>/dev/null || pwd)\" && python web-sample/_verify.py", "Bash=ls .venv/Scripts/ 2>/dev/null | head; echo \"---\"; python -c \"import websockets, sys; print('websockets', websockets.__version__); print(sys.executable)\"", "Bash=cd \"C:\\Users\\Lenovo\\PycharmProjects\\UMPS\" && ./.venv/Scripts/python.exe -c \"import sys,websockets,yaml,requests; print(sys.executable, websockets.__version__)\" 2>&1", "Bash=cd \"C:\\Users\\Lenovo\\PycharmProjects\\UMPS\" && ./.venv/Scripts/python.exe -c \"\nimport websockets, asyncio, traceback\nprint('ver', websockets.__version__)\ntry:\n    from websockets.uri import parse_uri\n    print('parsed:', parse_uri('ws01'))\nexcept Exception as e:\n    print('parse_uri error:', type(e).__name__, e)\n\nasync def t():\n    try:\n        async with websockets.connect('ws01') as c:\n            print('connected', c)\n    except Exception as e:\n        print('connect error:', type(e).__name__, repr(e))\nasyncio.run(asyncio.wait_for(t(), 4))\n\" 2>&1 | head -30"]
